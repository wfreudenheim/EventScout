# Pull new newsletters via IMAP and commit them as stripped text so the cloud
# sweep routine (which has no mail credentials) can parse them.
# 05:30 UTC = 1:30am EDT / 12:30am EST, Wed + Sun — 30 min before the sweep.
name: Fetch inbox

on:
  schedule:
    - cron: "30 5 * * 0,3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch newsletters
        env:
          SCOUT_EMAIL: ${{ secrets.SCOUT_EMAIL }}
          SCOUT_EMAIL_PASSWORD: ${{ secrets.SCOUT_EMAIL_PASSWORD }}
        run: npx tsx src/scripts/fetch-inbox.ts --limit 300
      - name: Convert to text
        run: |
          npx tsx src/scripts/inbox-to-text.ts
          npx tsx src/scripts/inbox-to-text.ts --prune
      - name: Commit
        run: |
          git config user.name "eventscout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/inbox/manifest.json data/inbox/txt
          git diff --cached --quiet && echo "No new newsletters." || git commit -m "inbox: fetch newsletters $(date -u +%Y-%m-%d)"
          git push
