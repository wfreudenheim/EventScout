# Runs 30 minutes before each cloud sweep. Does everything that doesn't need Claude
# and that the cloud routine can't do itself (no mail creds, restricted network):
#   1. pull new newsletters via IMAP -> data/inbox/txt/*.txt (stripped text)
#   2. Tier 1: fetch Eventbrite pages for T1 venues -> data/prefetch/<venue>-eb.json (unscored)
#   3. Tier 2: run generated scrapers (they ingest directly)
# then commits to main. 05:30 UTC = 1:30am EDT / 12:30am EST, Wed + Sun.
name: Prefetch (inbox + Tier 1/2)

on:
  schedule:
    - cron: "30 5 * * 0,3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prefetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch newsletters
        env:
          SCOUT_EMAIL: ${{ secrets.SCOUT_EMAIL }}
          SCOUT_EMAIL_PASSWORD: ${{ secrets.SCOUT_EMAIL_PASSWORD }}
        run: |
          npx tsx src/scripts/fetch-inbox.ts --limit 300
          npx tsx src/scripts/inbox-to-text.ts
          npx tsx src/scripts/inbox-to-text.ts --prune

      - name: Tier 1 — Eventbrite fetches
        continue-on-error: true
        run: |
          mkdir -p data/prefetch
          rm -f data/prefetch/*-eb.json
          for id in $(node -e "const L=require('./data/locations.json');(Array.isArray(L)?L:L.locations).filter(l=>l.status==='active'&&l.scrape_tier===1).forEach(l=>console.log(l.id))"); do
            echo "== $id"
            npx tsx src/scripts/fetch-eventbrite.ts "$id" || true
            [ -f "data/tmp/$id-eb.json" ] && mv "data/tmp/$id-eb.json" "data/prefetch/$id-eb.json"
          done
          ls -la data/prefetch

      - name: Tier 2 — generated scrapers
        continue-on-error: true
        run: npx tsx src/scripts/run-scraper.ts --all

      - name: Commit
        run: |
          git config user.name "eventscout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/inbox/manifest.json data/inbox/txt data/prefetch data/staged_events.json data/agent_log.json data/locations.json
          git diff --cached --quiet && echo "Nothing new." || git commit -m "prefetch: $(date -u +%Y-%m-%d) newsletters + Tier 1/2"
          git push
