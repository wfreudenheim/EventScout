# The cloud sweep routine pushes to claude/sweep-* (routines can always push to
# claude/ branches, but not to main once it has commits from other authors).
# This merges that branch into main and deletes it; the push then deploys the site.
name: Merge sweep

on:
  push:
    branches: ["claude/sweep-*"]

permissions:
  contents: write

concurrency:
  group: merge-sweep
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge sweep branch into main
        env:
          SWEEP_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "eventscout-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$SWEEP_BRANCH"
          if ! git merge --no-edit "origin/$SWEEP_BRANCH"; then
            echo "Conflict — taking the sweep branch's version of conflicted files"
            git diff --name-only --diff-filter=U | xargs -r git checkout --theirs --
            git add -A
            git commit --no-edit
          fi
          git push origin main
          git push origin --delete "$SWEEP_BRANCH" || true
